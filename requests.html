<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSFR Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-bar {
            display: flex;
            margin-bottom: 20px;
        }

        .search-bar input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .status-filter {
            display: flex;
        }

        .status-filter label {
            margin-right: 10px;
        }

        .request-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .request-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .request-card:hover {
            transform: scale(1.05);
        }

        .request-id, .requesterName, .department {
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #888;
        }

        /* Status colors (example) */
        .pending {
            background-color: #f9f9f9;
        }
        .printed {
            background-color: #dcf8c6;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <h1>FSFR Dashboard</h1>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search...">
                <div class="status-filter">
                    <label for="statusFilter">Filter by Status:</label>
                    <button id="pendingBtn" data-status="pending">Pending</button>
                    <button id="printedBtn" data-status="printed">Printed</button>
                </div>
            </div>

            <div id="requestList" class="request-list">
                <!-- Request cards will be dynamically rendered here -->
            </div>
        </div>
    </div>

    <script>
        const requests = []; // Placeholder for fetched data
        const elss = {
            searchInput: document.getElementById('searchInput'),
            statusFilter: document.querySelector('.status-filter'),
            pendingBtn: document.getElementById('pendingBtn'),
            printedBtn: document.getElementById('printedBtn'),
            requestList: document.getElementById('requestList')
        };


        function render() {
            const query = elss.searchInput.value.toLowerCase();
            const selectedStatus = elss.statusFilter.value;

            const filteredRequests = requests.filter(r => {
                if (selectedStatus !== 'All' && r.status !== selectedStatus) return false;
                if (!query) return true;
                const hay = [r.requestId, r.productionDate, r.requesterName, r.department, r.status, ...(r.items || []) .map(i => i.name)].join(' ').toLowerCase();
                return hay.includes(query);
            });

            elss.requestList.innerHTML = '';
            filteredRequests.forEach(r => elss.requestList.appendChild(buildCard(r)));
        }

        function buildCard(r) {
            const card = document.createElement('article');
            card.className = 'request-card';

            let statusClass = '';
            if (r.status === 'Printed') {
                statusClass = 'printed';
            } else {
                statusClass = 'pending';
            }

            const items = (r.items || []).map(i => `<div class="item">${i.name}</div>`).join('');

            card.innerHTML = `
                <div class="request-id">${r.requestId}</div>
                <div class="requesterName">${r.requesterName}</div>
                <div class="department">${r.department}</div>
                <div class="status-label ${statusClass}">${r.status}</div>
                <div class="items">${items}</div>
            `;

            return card;
        }

        // Example event listeners (replace with your actual data fetching and logic)
        elss.searchInput.addEventListener('input', render);
        elss.pendingBtn.addEventListener('click', () => render());
        elss.printedBtn.addEventListener('click', () => render());

        // Placeholder for fetching data
        function fetchData() {
            // Replace with your actual data fetching logic
            // This is just a dummy data example
            const dummyData = [
                { requestId: 'REQ001', productionDate: '2024-07-01', requesterName: 'John Doe', department: 'Sales', status: 'Pending', items: [] },
                { requestId: 'REQ002', productionDate: '2024-07-02', requesterName: 'Jane Smith', department: 'Marketing', status: 'Printed', items: [] }
            ];
            requests.push(...dummyData);
            render();
        }

        // Call fetchData when the page loads
        fetchData();

    </script>
</body>
</html>
